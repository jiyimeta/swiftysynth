name: SwiftySynthExample

options:
  developmentLanguage: en
  deploymentTarget:
    iOS: 16.0
    macOS: 13.0

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  swiftysynth:
    path: ../../

targets:
  SwiftySynthExample:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dev.SwiftySynthExample
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    sources:
      - path: SwiftySynthExample
        excludes:
          - Sounds
          - Resources
      - path: SwiftySynthExample/Sounds
        type: folder
        optional: true
      - path: SwiftySynthExample/Resources/Midi
        type: folder
        optional: true
    dependencies:
      - package: swiftysynth
        product: SwiftySynth

  SwiftySynthExampleMac:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dev.SwiftySynthExample.Mac
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    sources:
      - path: SwiftySynthExample
        excludes:
          - Sounds
          - Resources
      - path: SwiftySynthExample/Sounds
        type: folder
        optional: true
      - path: SwiftySynthExample/Resources/Midi
        type: folder
        optional: true
    dependencies:
      - package: swiftysynth
        product: SwiftySynth
