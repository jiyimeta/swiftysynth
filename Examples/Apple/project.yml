name: SwiftySynthExample

options:
  developmentLanguage: en
  deploymentTarget:
    iOS: 16.0
    macOS: 13.0

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  swiftysynth:
    path: ../../

targets:
  SwiftySynthExample:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dev.SwiftySynthExample
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        Release:
          # DEMO-ONLY, see "The fix" in Examples/README.md: project-level
          # Debug SWIFT_OPTIMIZATION_LEVEL does NOT reach a local (path:)
          # SwiftPM dependency in this Xcode toolchain -- verified
          # empirically, the package always compiles -Onone under the
          # "Debug" configuration name regardless of inherited settings.
          # Riding the Release configuration (where the package genuinely
          # gets -O) and forcing just this app target back to -Onone is the
          # working alternative, and this app intentionally keeps it here so
          # a plain `xcodebuild -configuration Release` reproduces the fix.
          #
          # DO NOT copy this onto a shipping app's archive/App-Store Release
          # configuration -- it would ship an unoptimized (-Onone) PRODUCTION
          # binary. For a real app, either duplicate Release as a dedicated
          # local, non-distribution configuration (e.g. "Debug-Optimized" /
          # "Profile") and put this override there instead, or apply it via
          # an uncommitted local .xcconfig -- never on the same Release
          # configuration you archive with.
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    scheme: {}
    sources:
      - path: SwiftySynthExample
        excludes:
          - Sounds
          - Resources
      - path: SwiftySynthExample/Sounds
        type: folder
        optional: true
      - path: SwiftySynthExample/Resources/Midi
        type: folder
        optional: true
    dependencies:
      - package: swiftysynth
        product: SwiftySynth

  SwiftySynthExampleMac:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dev.SwiftySynthExample.Mac
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
      configs:
        Release:
          # DEMO-ONLY -- see Examples/README.md "The fix" and the same
          # rationale + production warning as the iOS target above: keep
          # this app target -Onone while SwiftySynth builds -O under the
          # Release configuration name. DO NOT copy this onto a shipping
          # app's archive Release configuration.
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    scheme: {}
    sources:
      - path: SwiftySynthExample
        excludes:
          - Sounds
          - Resources
      - path: SwiftySynthExample/Sounds
        type: folder
        optional: true
      - path: SwiftySynthExample/Resources/Midi
        type: folder
        optional: true
    dependencies:
      - package: swiftysynth
        product: SwiftySynth
